name: image

# Builds the CUDA worker image and pushes it to GHCR as ghcr.io/<owner>/<repo>.
# In a public repo the package inherits public visibility, so RunPod can pull it with no
# registry credentials; for a private repo, add a RunPod registry auth (see README).
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Client-side files never reach the image.
    paths-ignore: ["README.md", "scripts/deploy.py", "scripts/invoke.py"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "laya[serve]==0.3.21" -r requirements.txt pytest
      - run: pytest -q tests

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # The image is ~7 GB (torch + CUDA libraries + three baked checkpoints); the stock
      # runner has ~14 GB free, so drop toolchains this build never uses.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      # Image references must be lowercase; the owner name isn't.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          # Reusing layers keeps their digests stable, so a handler-only change makes RunPod
          # hosts pull a few KB instead of the whole ~7 GB image again.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
